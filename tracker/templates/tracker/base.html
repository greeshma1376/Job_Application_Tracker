{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>{% block title %}Job & Internship Application Tracker{% endblock %}</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'tracker/css/style.css' %}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="{% url 'task_list' %}" class="brand">
                <i class="fa-solid fa-briefcase brand-icon"></i>
                <span class="brand-text">AppTracker<span class="accent">.io</span></span>
            </a>
            <div class="nav-actions">
                <a href="{% url 'add_task' %}" class="btn btn-primary">
                    <i class="fa-solid fa-plus"></i> Add Application
                </a>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="container">
            {% block content %}
            {% endblock %}
        </div>
    </main>

    <footer class="footer">
        <div class="container footer-content">
            <p>&copy; 2026 Job & Internship Application Tracker. Built with Python & Django.</p>
        </div>
    </footer>

    <!-- Custom JavaScript -->
    <script src="{% static 'tracker/js/main.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
